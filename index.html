        /* Custom overrides & base styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;

        .font-montserrat {

        /* Cherry blossom petals floating */
        .petal {
            position: absolute;
            font-size: 1.4rem;
            opacity: 0.3;
            pointer-events: none;
            user-select: none;
            color: #B07C8C;
            animation: floatPetals linear infinite;
        }

        @keyframes floatPetals {
            0% {
                transform: translateY(0px) rotate(0deg) scale(1);
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-120px) rotate(180deg) scale(0.8);
                opacity: 0;
            }
        }

        /* subtle wave decor */
        .wave-divider {
            background: repeating-linear-gradient(90deg,
                    transparent,
                    transparent 8px,
                    rgba(30, 42, 68, 0.06) 8px,
                    rgba(30, 42, 68, 0.06) 10px);
            height: 2px;
            width: 100%;
        }

        /* nav link hover */
        .nav-link {
            position: relative;
            font-weight: 400;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1.5px;
            background-color: #B07C8C;
            transition: width 0.25s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .nav-link:hover {
            color: #B07C8C;
        }

        /* category icon circle */
        .cat-circle {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .cat-circle:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 28px rgba(30, 42, 68, 0.08);
        }

        /* book card */
        .book-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
        }
        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(30, 42, 68, 0.08);
        }

        .btn-rose {
            background-color: #B07C8C;
            color: #F7F3F1;
            padding: 0.6rem 1.8rem;
            border-radius: 9999px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.25s ease, transform 0.2s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-rose:hover {
            background-color: #9a6a7a;
            transform: scale(1.02);
        }

        .btn-outline-rose {
            background: transparent;
            color: #B07C8C;
            border: 1.5px solid #B07C8C;
            padding: 0.5rem 1.6rem;
            border-radius: 9999px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.25s ease, color 0.25s ease;

            display: inline-flex;

            gap: 0.4rem;

            background: #B07C8C;
            color: #F7F3F1;
        }
